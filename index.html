<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Supermercado Osses</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <header>
    <h1>Supermercado Económico</h1>
    <i class="fa-solid fa-cart-shopping fa-2x">
      <span class="total-productos-carro"></span>
    </i>
  </header>



  <main>

    <!-- --Contenedor para los productos a la venta-- -->

    <section class="productos-galeria"></section>


    <!-- --Contenedor que recibe los productos seleccionados para la compra -->

    <aside class="carro-compras">
      <h2>Carro</h2>
      <i class="fa-solid fa-x fa-2x"></i>
      <div class="contenedor-productos-carro"></div>

      <div class="contenedor-precio">
        <p>Total:</p>
        <p class="total-carro">$0</p>
        <button class="btn-finalizar">Finalizar Compra</button>
      </div>
    </aside>

  </main>

  <div id="modal-confirmacion" class="modal">
    <div class="modal-contenido">
      <span class="cerrar-modal">&times;</span>
      <h2>¡Gracias por tu compra!</h2>
      <p>Tu pedido ha sido procesado con éxito.</p>
    </div>
  </div>




  <script src="https://kit.fontawesome.com/3db288ecf2.js" crossorigin="anonymous"></script>
  <script src="assets/js/script2.js"></script>

</body>





</html>
